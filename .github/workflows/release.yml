name: Release Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag del release'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm run verify

      - name: Build Windows installer and portable
        run: npm run build:win

      - name: Generate checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist\OllamaNeitor-*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $lines | Out-File -FilePath dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: OllamaNeitor 1.0.0
          prerelease: false
          overwrite_files: true
          make_latest: true
          files: |
            dist/OllamaNeitor-*-x64.exe
            dist/OllamaNeitor-*-portable.exe
            dist/OllamaNeitor-*-x64.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
